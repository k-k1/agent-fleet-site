name: check

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: external links rot, and security.txt's Expires runs out, without any push.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local links, images, hreflang, security.txt
        run: python3 scripts/check.py
      - name: External links and GitHub heading anchors
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check.py --online
